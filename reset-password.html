n></form><a href="https://daneil5126.github.io/Cal/">返回登录</a></main><script>/* Dedicated recovery page. No business modules, storage, refresh tokens or role changes. */
(() => {
 'use strict';
 const endpoint='https://hrvtuvjuhvmsygerernc.supabase.co',key='sb_publishable_3QcBVFX7qoMnZ2xxgE9B7A_t4Q64b5A';
 const callback='https://daneil5126.github.io/Cal/reset-password.html';
 const requestForm=document.getElementById('request'),resetForm=document.getElementById('reset'),status=document.getElementById('status');
 let token=null,expires=0,busy=false,expiryTimer,cooldownTimer,closed=false;
 const params=new URLSearchParams(location.hash.slice(1));
 // Remove all fragments before making any request, even when the link is invalid.
 history.replaceState(null,'',location.pathname);
 const say=text=>{status.textContent=text;};
 function clear(){token=null;expires=0;clearTimeout(expiryTimer);resetForm.reset();resetForm.hidden=true;}
 async function api(path,body,bearer,method){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
  try{
   const response=await fetch(endpoint+'/auth/v1/'+path,{method:method||(body===undefined?'GET':'POST'),headers:{apikey:key,'Content-Type':'application/json',...(bearer?{Authorization:'Bearer '+bearer}:{})},...(body===undefined?{}:{body:JSON.stringify(body)}),signal:controller.signal,cache:'no-store',credentials:'omit',redirect:'error',referrerPolicy:'no-referrer'});
   const text=await response.text();if(text.length>65536)throw Error('服务器响应异常，请稍后重试。');
   let data;try{data=text?JSON.parse(text):{};}catch{throw Error('服务器响应异常，请稍后重试。');}
   if(!response.ok){const code=data?.code||data?.error_code;const error=Error(response.status===429?'请求太频繁，请稍后再试。':code==='same_password'?'新密码需要与旧密码不同。':code==='weak_password'?'密码强度不足，请使用更长、更难猜的密码。':response.status===401||response.status===403?'恢复链接已失效，请重新申请。':'操作未获确认，请稍后重试。');error.status=response.status;throw error;}return data;
  }catch(error){if(error.name==='AbortError')throw Error('请求超时，请稍后重试。');throw error;}
  finally{clearTimeout(timer);}

 requestForm.addEventListener('submit',async event=>{
  event.preventDefault();if(busy||closed||!requestForm.reportValidity())return;

  catch(error){if(!closed){say(error.message);button.disabled=false;}}
  finally{busy=false;}
 });
 resetForm.addEventListener('submit',async event=>{
  event.preventDefault();if(busy||closed||!resetForm.reportValidity())return;
  if(!token||Date.now()>=expires){clear();requestForm.hidden=false;say('恢复链接已失效，请重新申请。');return;}

   await api('logout?scope=local',{},activeToken).catch(()=>{});
  }catch(error){if(!closed){say(error.message);if(error.status===401||error.status===403){clear();requestForm.hidden=false;}}}
  finally{resetForm.reset();button.disabled=false;busy=false;}
 });
 async function initialize(){
  const fragmentToken=params.get('access_token'),type=params.get('type'),problem=params.has('error')||params.has('error_code');
  params.delete('access_token');params.delete('refresh_token');
  if(!fragmentToken){say(problem?'恢复链接已失效，请重新申请。':'输入 Business Suite 登录邮箱。');return;}
  requestForm.hidden=true;

  try{
   const claims=JSON.parse(atob(fragmentToken.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
   const until=Number(claims.exp)*1000;
   if(!Number.isFinite(until)||until<=Date.now())throw Error('恢复链接已过期，请重新申请。');
   const user=await api('user',undefined,fragmentToken);if(closed)return;

   expiryTimer=setTimeout(()=>{clear();requestForm.hidden=false;say('恢复操作已超时，请重新申请邮件。');},expires-Date.now());

  }catch{clear();requestForm.hidden=false;say('无法验证恢复链接，可能已过期。请重新申请邮件。');}
 }
 addEventListener('pagehide',()=>{closed=true;clear();requestForm.reset();clearTimeout(cooldownTimer);});
 addEventListener('pageshow',event=>{if(event.persisted)location.reload();});
 void initialize();
})();
